<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>守宮小助手</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f4f1ea;
    color: #2a2a2a;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem;
    background: #2d7a46;
    color: white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  header a.contact-btn {
    background: white;
    color: #2d7a46;
    text-decoration: none;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 0.6rem 0.9rem;
    border-radius: 1.1rem;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-row.user .bubble {
    background: #2d7a46;
    color: white;
    border-bottom-right-radius: 0.25rem;
  }
  .bubble-row.bot .bubble {
    background: white;
    border: 1px solid #e0ddd3;
    border-bottom-left-radius: 0.25rem;
  }
  .bubble-row.bot .bubble.error {
    background: #fdecea;
    border-color: #f3c4bd;
    color: #8a2c1f;
  }

  .bubble-photos {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }
  .bubble-photos img {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 0.6rem;
    border: 1px solid #e0ddd3;
    cursor: pointer;
  }

  .category-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }
  .category-btn {
    background: white;
    border: 1px solid #2d7a46;
    color: #2d7a46;
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .category-btn:hover { background: #eef6f1; }
  .category-btn.back { border-color: #999; color: #666; }

  .product-cards {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 0.4rem;
  }
  .product-card {
    display: flex;
    gap: 0.7rem;
    background: #faf9f5;
    border: 1px solid #e0ddd3;
    border-radius: 0.7rem;
    padding: 0.6rem;
  }
  .product-card img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 0.5rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .product-card .info { flex: 1; min-width: 0; }
  .product-card .name { font-weight: 600; font-size: 0.92rem; }
  .product-card .desc { font-size: 0.82rem; color: #666; margin-top: 0.15rem; }
  .product-card .ask-btn {
    margin-top: 0.35rem;
    background: none;
    border: 1px solid #2d7a46;
    color: #2d7a46;
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    font-size: 0.78rem;
    cursor: pointer;
  }

  .typing-dots {
    display: inline-flex;
    gap: 0.25rem;
    padding: 0.3rem 0;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #999;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#composer {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    background: white;
    border-top: 1px solid #e5e2d8;
    flex-shrink: 0;
  }
  form#composer input[type="text"] {
    flex: 1;
    padding: 0.65rem 0.9rem;
    border: 1px solid #ccc;
    border-radius: 999px;
    font-size: 0.95rem;
    outline: none;
  }
  form#composer input[type="text"]:focus {
    border-color: #2d7a46;
  }
  form#composer button {
    background: #2d7a46;
    color: white;
    border: none;
    border-radius: 999px;
    padding: 0 1.3rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  form#composer button:disabled {
    background: #a9c9b3;
    cursor: default;
  }
</style>
</head>
<body>

<header>
  <h1>🦎 守宮小助手</h1>
  <a class="contact-btn" href="mailto:curesname@gmail.com?subject=守宮預訂諮詢">聯絡我們預訂</a>
</header>

<div id="messages"></div>

<form id="composer" autocomplete="off">
  <input type="text" id="input" placeholder="想找什麼樣式的守宮呢？" />
  <button type="submit" id="sendBtn">送出</button>
</form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

// 這個分頁自己的對話歷史——不會存到後端、也不會跟其他客人共用，重新整理就會清空
let history = [];

// 點「問這隻多少錢」時會設這個，讓下一次 /chat 請求直接指定商品 id（不用關鍵字比對），
// 送出後立刻清空，之後正常打字問問題不會受影響。
let pendingProductId = null;

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function addBubble(role, text, photoUrls) {
  const row = document.createElement("div");
  row.className = `bubble-row ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");

  if (photoUrls && photoUrls.length) {
    const photosDiv = document.createElement("div");
    photosDiv.className = "bubble-photos";
    photoUrls.forEach((url) => {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "商品照片";
      img.addEventListener("click", () => window.open(url, "_blank"));
      photosDiv.appendChild(img);
    });
    bubble.appendChild(photosDiv);
  }

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function collectPhotoUrls(candidates, maxPhotos = 6) {
  if (!candidates) return [];
  const seen = new Set();
  const urls = [];
  for (const c of candidates) {
    for (const url of c.photo_urls || []) {
      if (!seen.has(url)) {
        seen.add(url);
        urls.push(url);
        if (urls.length >= maxPhotos) return urls;
      }
    }
  }
  return urls;
}

function addTypingIndicator() {
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  row.id = "typingRow";
  row.innerHTML = `<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTypingIndicator() {
  const row = document.getElementById("typingRow");
  if (row) row.remove();
}

/* ---------- 大分類快速瀏覽（不呼叫 LLM，純查資料庫，不花 token） ---------- */

function addButtonRow(buttons) {
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.style.background = "transparent";
  bubble.style.border = "none";
  bubble.style.padding = "0";

  const btnRow = document.createElement("div");
  btnRow.className = "category-row";
  buttons.forEach(({ label, onClick, isBack }) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "category-btn" + (isBack ? " back" : "");
    btn.textContent = label;
    btn.addEventListener("click", onClick);
    btnRow.appendChild(btn);
  });
  bubble.appendChild(btnRow);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

let categoryOptions = null; // /categories 的回應，快取起來避免每次點都重打

async function showTopLevelCategories() {
  if (!categoryOptions) {
    try {
      const res = await fetch("/categories");
      categoryOptions = await res.json();
    } catch (err) {
      console.error(err);
      return;
    }
  }

  const buttons = [];
  if (categoryOptions.species.length) {
    buttons.push({ label: "🦎 依物種瀏覽", onClick: () => showSubCategories("species", "物種", categoryOptions.species) });
  }
  if (categoryOptions.colors.length) {
    buttons.push({ label: "🎨 依顏色瀏覽", onClick: () => showSubCategories("color", "顏色", categoryOptions.colors) });
  }
  if (categoryOptions.patterns.length) {
    buttons.push({ label: "🐆 依花紋瀏覽", onClick: () => showSubCategories("pattern", "花紋", categoryOptions.patterns) });
  }
  buttons.push({ label: "⭐ 熱門推薦", onClick: () => browseCategory("featured", null, "熱門推薦") });
  buttons.push({ label: "🆕 新品上市", onClick: () => browseCategory("new_arrival", null, "新品上市") });

  if (buttons.length) addButtonRow(buttons);
}

function showSubCategories(categoryType, groupLabel, values) {
  const buttons = values.map((value) => ({
    label: value,
    onClick: () => browseCategory(categoryType, value, `${groupLabel}：${value}`),
  }));
  buttons.push({ label: "← 返回", isBack: true, onClick: () => showTopLevelCategories() });
  addButtonRow(buttons);
}

function renderProductCards(products) {
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (!products.length) {
    bubble.textContent = "這個分類目前沒有上架中的商品耶，換一個看看？";
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return;
  }

  const cardsDiv = document.createElement("div");
  cardsDiv.className = "product-cards";
  products.forEach((p) => {
    const card = document.createElement("div");
    card.className = "product-card";
    const photoUrl = (p.photo_urls || [])[0];
    if (photoUrl) {
      const img = document.createElement("img");
      img.src = photoUrl;
      img.alt = p.morph_name;
      img.addEventListener("click", () => window.open(photoUrl, "_blank"));
      card.appendChild(img);
    }
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `
      <div class="name">${escapeHtml(p.species)} · ${escapeHtml(p.morph_name)}</div>
      <div class="desc">${escapeHtml(p.description || "")}</div>
    `;
    const askBtn = document.createElement("button");
    askBtn.type = "button";
    askBtn.className = "ask-btn";
    askBtn.textContent = "問這隻多少錢／有貨嗎";
    askBtn.addEventListener("click", () => {
      input.value = `${p.morph_name} 多少錢？還有貨嗎？`;
      pendingProductId = p.product_id; // 直接指定商品，避免關鍵字比對抓錯/抓不到
      form.requestSubmit();
    });
    info.appendChild(askBtn);
    card.appendChild(info);
    cardsDiv.appendChild(card);
  });
  bubble.appendChild(cardsDiv);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function browseCategory(category, value, label) {
  addBubble("user", `📂 ${label}`);
  addTypingIndicator();
  try {
    const params = new URLSearchParams({ category });
    if (value) params.set("value", value);
    const res = await fetch(`/catalog/browse?${params.toString()}`);
    const data = await res.json();
    removeTypingIndicator();
    renderProductCards(data.products || []);
  } catch (err) {
    removeTypingIndicator();
    console.error(err);
    addBubble("bot", "抱歉，查詢時出了點問題，可以再試一次嗎？");
  }
  // 瀏覽完再把主選單秀一次，方便繼續逛
  showTopLevelCategories();
}

addBubble("bot", "哈囉～歡迎光臨🦎 想找什麼樣式、顏色的守宮都可以直接問我，也可以問問目前有什麼推薦的！");
showTopLevelCategories();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addBubble("user", message);
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;
  addTypingIndicator();

  try {
    const formData = new FormData();
    formData.append("message", message);
    formData.append("history", JSON.stringify(history));
    if (pendingProductId !== null) {
      formData.append("product_id", pendingProductId);
      pendingProductId = null;
    }

    const res = await fetch("/chat", { method: "POST", body: formData });
    if (!res.ok) throw new Error(`伺服器回應錯誤（${res.status}）`);
    const data = await res.json();

    removeTypingIndicator();
    addBubble("bot", data.reply, collectPhotoUrls(data.candidates));

    history.push({ role: "user", text: message });
    history.push({ role: "assistant", text: data.reply });
    // 只留最近幾輪，避免這個分頁的對話無限長下去
    if (history.length > 20) history = history.slice(-20);
  } catch (err) {
    removeTypingIndicator();
    const bubble = addBubble("bot", "抱歉，剛剛傳送時出了點問題，可以再試一次嗎？");
    bubble.classList.add("error");
    console.error(err);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
