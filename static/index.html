<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>守宮小助手</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f4f1ea;
    color: #2a2a2a;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem;
    background: #2d7a46;
    color: white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  header a.contact-btn {
    background: white;
    color: #2d7a46;
    text-decoration: none;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 0.6rem 0.9rem;
    border-radius: 1.1rem;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-row.user .bubble {
    background: #2d7a46;
    color: white;
    border-bottom-right-radius: 0.25rem;
  }
  .bubble-row.bot .bubble {
    background: white;
    border: 1px solid #e0ddd3;
    border-bottom-left-radius: 0.25rem;
  }
  .bubble-row.bot .bubble.error {
    background: #fdecea;
    border-color: #f3c4bd;
    color: #8a2c1f;
  }

  .typing-dots {
    display: inline-flex;
    gap: 0.25rem;
    padding: 0.3rem 0;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #999;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#composer {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    background: white;
    border-top: 1px solid #e5e2d8;
    flex-shrink: 0;
  }
  form#composer input[type="text"] {
    flex: 1;
    padding: 0.65rem 0.9rem;
    border: 1px solid #ccc;
    border-radius: 999px;
    font-size: 0.95rem;
    outline: none;
  }
  form#composer input[type="text"]:focus {
    border-color: #2d7a46;
  }
  form#composer button {
    background: #2d7a46;
    color: white;
    border: none;
    border-radius: 999px;
    padding: 0 1.3rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  form#composer button:disabled {
    background: #a9c9b3;
    cursor: default;
  }
</style>
</head>
<body>

<header>
  <h1>🦎 守宮小助手</h1>
  <a class="contact-btn" href="mailto:curesname@gmail.com?subject=守宮預訂諮詢">聯絡我們預訂</a>
</header>

<div id="messages"></div>

<form id="composer" autocomplete="off">
  <input type="text" id="input" placeholder="想找什麼樣式的守宮呢？" />
  <button type="submit" id="sendBtn">送出</button>
</form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

// 這個分頁自己的對話歷史——不會存到後端、也不會跟其他客人共用，重新整理就會清空
let history = [];

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = `bubble-row ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTypingIndicator() {
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  row.id = "typingRow";
  row.innerHTML = `<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTypingIndicator() {
  const row = document.getElementById("typingRow");
  if (row) row.remove();
}

addBubble("bot", "哈囉～歡迎光臨🦎 想找什麼樣式、顏色的守宮都可以直接問我，也可以問問目前有什麼推薦的！");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addBubble("user", message);
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;
  addTypingIndicator();

  try {
    const formData = new FormData();
    formData.append("message", message);
    formData.append("history", JSON.stringify(history));

    const res = await fetch("/chat", { method: "POST", body: formData });
    if (!res.ok) throw new Error(`伺服器回應錯誤（${res.status}）`);
    const data = await res.json();

    removeTypingIndicator();
    addBubble("bot", data.reply);

    history.push({ role: "user", text: message });
    history.push({ role: "assistant", text: data.reply });
    // 只留最近幾輪，避免這個分頁的對話無限長下去
    if (history.length > 20) history = history.slice(-20);
  } catch (err) {
    removeTypingIndicator();
    const bubble = addBubble("bot", "抱歉，剛剛傳送時出了點問題，可以再試一次嗎？");
    bubble.classList.add("error");
    console.error(err);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
